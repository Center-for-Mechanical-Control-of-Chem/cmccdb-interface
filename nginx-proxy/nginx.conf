                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_pass http://host.containers.internal:90;
        }
    }
    server {
        listen 80;
        server_name preview-mechanochemistry.chem.tamu.edu;
        location / {
                proxy_set_header Host $host;

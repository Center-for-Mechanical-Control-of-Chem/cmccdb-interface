events {
   worker_connections 1024;
}

http {
    # One 5 MB dataset and up to five 5 MB attachments, plus multipart overhead.
    client_max_body_size 32m;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /var/log/nginx.log;

    gzip on;
    gzip_disable "msie6";

    # for the development server's live-reload websocket (see cmccdb-frontend.conf)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream flask {
        server unix:/run/gunicorn.sock max_fails=3 fail_timeout=60s;
    }

    server {
        listen 80;

        # The front end: the built one in /app/cmccdb-interface/vue, or the development server (hot reload) when
        # start_app.sh runs one with CMCCDB_DEV_FRONTEND_PROXY=true. start_app.sh writes this file at each start.
        include /etc/nginx/cmccdb-frontend.conf;

        location /api/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_connect_timeout 120;
            proxy_read_timeout 60;
            proxy_send_timeout 60;
            proxy_pass http://flask/client/api/;
            proxy_ignore_client_abort on;
        }

        location /editor/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_connect_timeout 120;
            proxy_read_timeout 60;
            proxy_send_timeout 60;
            proxy_pass http://flask/editor/;
            proxy_ignore_client_abort on;
        }
    }
}

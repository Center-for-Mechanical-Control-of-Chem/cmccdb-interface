services:
  database_preview:
    image: "${CMCCDB_PREVIEW_DATABASE_IMAGE:-mcs07/postgres-rdkit:latest}"
    command: [ "postgres", "-c", "log_statement=all" ]
    ports:
      - "5435:5432"
    environment:
      - PGDATA=/data
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
    volumes:
      - /home/cmcc-database-preview:/data:z
  web_preview:
    depends_on:
      - database_preview
    environment:
      - POSTGRES_DATABASE=cmcc
      - POSTGRES_HOST=database_preview
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - CMCCDB_SESSION_KEY=${CMCCDB_SESSION_KEY}
      - CMCCDB_LAUNCH_DEV_INTERFACE=true
      # the /api/dev endpoints are off unless asked for (docker-compose-dev.yml turns them on with its back end)
      - CMCCDB_DEV_ENDPOINTS=true
    image: "${CMCCDB_PREVIEW_IMAGE:-cmccdb/interface-preview:2025.09.3}"
    pull_policy: never
    build:
      context: ../..
      dockerfile: cmccdb-interface/cmccdb_interface/Dockerfile
      target: preview
    ports:
      - "90:80"
      - "91:95"
    volumes:
      - /home/cmccdb-credentials:/app/credentials:z
      - /home/cmccdb-ssh-config:/root/.ssh/:z
      - /home/cmccdb-tmp:/app/tmp:z
      - /home/cmccdb-data:/app/cmccdb-data:z
      - /home/cmccdb-schema/cmccdb_schema:/app/cmccdb-schema/cmccdb_schema:z
      - /home/cmccdb-schema/js/cmccdb-schema:/app/cmccdb-schema/js/cmccdb-schema:z
      - /home/cmccdb-interface/app:/app/cmccdb-interface/dev:z
      - preview-node-modules:/app/cmccdb-interface/dev/node_modules
      - preview-npm-cache:/root/.npm
      - /home/cmccdb-interface/cmccdb_interface:/app/cmccdb-interface/cmccdb_interface:z
volumes:
  preview-node-modules:
  preview-npm-cache:
